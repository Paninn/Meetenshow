<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meetenshow Moderator Recruitment</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#050816;
color:white;
font-family:Inter,Arial,sans-serif;
overflow-x:hidden;
}
#particles{
position:fixed;
inset:0;
z-index:-2;
}
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}
h1{
font-size:clamp(60px,10vw,120px);
background:linear-gradient(90deg,#fff,#8b5cf6,#60a5fa);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}
.subtitle{
font-size:22px;
color:#cbd5e1;
margin-top:15px;
}
.btn{
margin-top:30px;
padding:18px 35px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#6366f1,#8b5cf6);
color:white;
font-size:18px;
cursor:pointer;
box-shadow:0 0 35px rgba(99,102,241,.6);
transition:.3s;
}
.btn:hover{transform:translateY(-5px) scale(1.05)}
.container{max-width:1200px;margin:auto;padding:80px 20px}
.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.1);
padding:35px;
border-radius:28px;
transform-style:preserve-3d;
transition:transform .2s ease;
}
.card h2{margin-bottom:15px;font-size:40px}
ul{padding-left:20px;line-height:2}
form{
margin-top:40px;
display:grid;
gap:15px;
}
input,textarea{
padding:15px;
border:none;
border-radius:14px;
background:rgba(255,255,255,.08);
color:white;
}
.notice{
display:none;
margin-top:10px;
padding:14px;
border-radius:12px;
background:#10b981;
}
</style>
</head>
<body>

<canvas id="particles"></canvas>

<section class="hero">
<h1>MODERATOR</h1>
<div class="subtitle">Meetenshow Production Recruitment</div>
<button class="btn" onclick="document.getElementById('apply').scrollIntoView({behavior:'smooth'})">Подать заявку</button>
</section>

<div class="container">
<div class="card" id="tilt">
<h2>Набор модераторов</h2>
<ul>
<li>Контроль чатов и порядка</li>
<li>Помощь участникам проекта</li>
<li>Проверка обращений</li>
<li>Активность и ответственность</li>
</ul>

<form id="apply" onsubmit="sendForm(event)">
<input placeholder="Имя" required>
<input placeholder="Возраст" required>
<input placeholder="Telegram" required>
<textarea placeholder="Почему хотите стать модератором?"></textarea>
<button class="btn">Отправить заявку</button>
<div class="notice" id="ok">Заявка отправлена!</div>
</form>
</div>
</div>

<script>
function sendForm(e){
e.preventDefault();
document.getElementById('ok').style.display='block';
}

// 3D hover effect
const card=document.getElementById('tilt');
card.addEventListener('mousemove',(e)=>{
const r=card.getBoundingClientRect();
const x=e.clientX-r.left;
const y=e.clientY-r.top;
const rx=-(y-r.height/2)/15;
const ry=(x-r.width/2)/15;
card.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;
});
card.addEventListener('mouseleave',()=>{
card.style.transform='rotateX(0) rotateY(0)';
});

// particles
const canvas=document.getElementById('particles');
const ctx=canvas.getContext('2d');
function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

const particles=[];
for(let i=0;i<120;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
vx:(Math.random()-0.5)*0.8,
vy:(Math.random()-0.5)*0.8,
r:Math.random()*2+1
});
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
particles.forEach(p=>{
p.x+=p.vx;
p.y+=p.vy;
if(p.x<0||p.x>canvas.width)p.vx*=-1;
if(p.y<0||p.y>canvas.height)p.vy*=-1;
ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fillStyle='rgba(139,92,246,.8)';
ctx.fill();
});
requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
